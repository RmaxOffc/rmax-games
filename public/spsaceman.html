<!DOCTYPE html>
<html lang="en">
<head>
    <!-- style tetap sama -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMAX · Spaceman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0b0e;
            background-image: radial-gradient(ellipse at 50% 0%, #0d0d1a 0%, #060608 70%);
            color: #e8e6e3;
            padding: 16px;
        }

        .header {
            width: 100%;
            max-width: 1100px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 16, 0.95);
            border-bottom: 2px solid #f0b90b;
            border-radius: 10px 10px 0 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .back-btn {
            color: #7a8ba8;
            text-decoration: none;
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid #2a2d36;
            border-radius: 5px;
            transition: 0.2s;
        }
        .header .back-btn:hover {
            border-color: #f0b90b;
            color: #f0b90b;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo .icon {
            font-size: 22px;
        }
        .header .logo .name {
            font-size: 18px;
            font-weight: 700;
            color: #f0b90b;
            letter-spacing: 1px;
        }
        .header .logo .sub {
            font-size: 9px;
            color: #5a6a7a;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(240, 185, 11, 0.06);
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid rgba(240, 185, 11, 0.06);
        }
        .header .coin-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px 4px 10px;
            background: #0a0b0e;
            border: 1px solid #1a1d24;
            border-radius: 6px;
        }
        .header .coin-display .label {
            font-size: 9px;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header .coin-display .amount {
            font-size: 16px;
            font-weight: 700;
            color: #f0b90b;
        }

        .game-container {
            width: 100%;
            max-width: 1100px;
            background: #0f1117;
            padding: 14px;
            border-radius: 0 0 10px 10px;
            border-left: 1px solid #1a1d24;
            border-right: 1px solid #1a1d24;
            border-bottom: 1px solid #1a1d24;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 14px;
        }
        @media (max-width: 860px) {
            .game-area { grid-template-columns: 1fr; }
        }

        .rocket-display {
            background: #0a0b10;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #1a1d24;
            position: relative;
            overflow: hidden;
        }
        .rocket-display .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .rocket-display .stars .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.6; }
        }

        .rocket-canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: radial-gradient(ellipse at 50% 80%, #0a0b16, #040406);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1a1d24;
            min-height: 250px;
        }
        .rocket-canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .multiplier-overlay .multiplier {
            font-size: 52px;
            font-weight: 900;
            color: #f0b90b;
            text-shadow: 0 0 40px rgba(240, 185, 11, 0.15), 0 4px 20px rgba(0,0,0,0.8);
            transition: 0.05s;
            font-family: 'Courier New', monospace;
            letter-spacing: -2px;
        }
        .multiplier-overlay .multiplier.crashed { color: #f6465d; }
        .multiplier-overlay .label {
            font-size: 10px;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: -2px;
        }
        .multiplier-overlay .status {
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            padding: 2px 16px;
            border-radius: 16px;
            display: inline-block;
        }
        .multiplier-overlay .status.ready {
            color: #0ecb81;
            background: rgba(14, 203, 129, 0.08);
        }
        .multiplier-overlay .status.flying {
            color: #f0b90b;
            background: rgba(240, 185, 11, 0.08);
            animation: pulseStatus 0.5s infinite alternate;
        }
        .multiplier-overlay .status.crashed {
            color: #f6465d;
            background: rgba(246, 70, 93, 0.08);
        }
        .multiplier-overlay .status.cashout {
            color: #0ecb81;
            background: rgba(14, 203, 129, 0.08);
        }
        @keyframes pulseStatus {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-history {
            background: #0a0b10;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #1a1d24;
        }
        .bet-history .title {
            font-size: 9px;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a1d24;
            padding-bottom: 6px;
        }
        .bet-history .history-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 140px;
            overflow-y: auto;
        }
        .bet-history .history-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 6px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            font-size: 11px;
            border-left: 2px solid transparent;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            0% { transform: translateX(-10px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .bet-history .history-item.win { border-left-color: #0ecb81; }
        .bet-history .history-item.lose { border-left-color: #f6465d; }
        .bet-history .history-item .mult { font-weight: 700; font-size: 12px; }
        .bet-history .history-item .mult.win { color: #0ecb81; }
        .bet-history .history-item .mult.lose { color: #f6465d; }
        .bet-history .history-item .bet { color: #5a6a7a; }

        .trade-controls {
            background: #0a0b10;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #1a1d24;
        }
        .trade-controls .label {
            font-size: 9px;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid #1a1d24;
            padding-bottom: 6px;
        }
        .trade-controls .amount-input {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .trade-controls .amount-input input {
            flex: 1;
            padding: 8px 12px;
            background: #060608;
            border: 1px solid #1a1d24;
            border-radius: 5px;
            color: #e8e6e3;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            min-width: 60px;
        }
        .trade-controls .amount-input input:focus {
            outline: none;
            border-color: #f0b90b;
        }
        .trade-controls .presets {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .trade-controls .presets button {
            padding: 3px 10px;
            background: #060608;
            border: 1px solid #1a1d24;
            border-radius: 4px;
            color: #5a6a7a;
            cursor: pointer;
            font-size: 10px;
            font-family: inherit;
            transition: 0.2s;
        }
        .trade-controls .presets button:hover {
            border-color: #f0b90b;
            color: #e8e6e3;
        }

        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-bet {
            padding: 10px;
            background: linear-gradient(135deg, #f0b90b, #d49a08);
            border: none;
            border-radius: 6px;
            color: #0a0b0e;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-bet:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(240, 185, 11, 0.15);
        }
        .btn-bet:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-cashout {
            padding: 10px;
            background: linear-gradient(135deg, #0ecb81, #0aab6a);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-cashout:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(14, 203, 129, 0.15);
        }
        .btn-cashout:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .live-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
            padding: 10px;
            background: #060608;
            border-radius: 6px;
            border: 1px solid #1a1d24;
        }
        .live-stats .stat .label {
            font-size: 8px;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-stats .stat .value {
            font-size: 14px;
            font-weight: 700;
            margin-top: 1px;
        }
        .live-stats .stat .value.green { color: #0ecb81; }
        .live-stats .stat .value.red { color: #f6465d; }
        .live-stats .stat .value.gold { color: #f0b90b; }

        @media (max-width: 700px) {
            .header { padding: 6px 14px; }
            .header .logo .name { font-size: 16px; }
            .game-container { padding: 10px; }
            .rocket-display { padding: 10px; }
            .multiplier-overlay .multiplier { font-size: 36px; }
            .trade-buttons { grid-template-columns: 1fr; }
            .live-stats { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 450px) {
            .header .logo .name { font-size: 14px; }
            .header .coin-display .amount { font-size: 13px; }
            .multiplier-overlay .multiplier { font-size: 28px; }
            .rocket-canvas-wrap { min-height: 160px; }
            .bet-history .history-list { max-height: 100px; }
            .btn-bet, .btn-cashout { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="#" class="back-btn">← Kembali</a>
        <div class="logo">
            <span class="icon">🚀</span>
            <span class="name">Spaceman</span>
            <span class="sub">RMAX</span>
        </div>
        <div class="coin-display">
            <span style="font-size:14px;">🪙</span>
            <span class="label">Saldo</span>
            <span class="amount" id="headerCoin">10.000</span>
        </div>
    </header>

    <div class="game-container">
        <div class="game-area">

            <div class="rocket-display">
                <div class="stars" id="stars"></div>
                <div class="rocket-canvas-wrap">
                    <canvas id="rocketCanvas"></canvas>
                    <div class="multiplier-overlay">
                        <div class="multiplier" id="multiplierDisplay">1.00</div>
                        <div class="label">MULTIPLIER</div>
                        <div class="status ready" id="gameStatus">🚀 READY</div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="bet-history">
                    <div class="title">📊 History</div>
                    <div class="history-list" id="historyList">
                        <div style="color:#4a5a6a;font-size:11px;text-align:center;padding:10px;">Belum ada history</div>
                    </div>
                </div>

                <div class="trade-controls">
                    <div class="label">💰 Taruhan</div>
                    <div class="amount-input">
                        <input type="number" id="betAmount" value="100" min="10" step="10" />
                        <div class="presets">
                            <button onclick="setBet(50)">50</button>
                            <button onclick="setBet(100)">100</button>
                            <button onclick="setBet(250)">250</button>
                            <button onclick="setBet(500)">500</button>
                            <button onclick="setBet(1000)">1000</button>
                        </div>
                    </div>
                    <div class="trade-buttons">
                        <button class="btn-bet" id="betBtn">🚀 BET</button>
                        <button class="btn-cashout" id="cashoutBtn" disabled>💰 CASHOUT</button>
                    </div>
                    <div class="live-stats">
                        <div class="stat"><div class="label">Multiplier</div><div class="value gold" id="liveMultiplier">1.00x</div></div>
                        <div class="stat"><div class="label">Profit</div><div class="value" id="liveProfit">-</div></div>
                        <div class="stat"><div class="label">Total Bet</div><div class="value" id="liveTotalBet">0</div></div>
                        <div class="stat"><div class="label">Win Rate</div><div class="value gold" id="liveWinRate">0%</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let state = {
                coins: 10000,
                bet: 100,
                isFlying: false,
                isCrashed: false,
                multiplier: 1.00,
                currentProfit: 0,
                totalBets: 0,
                totalWins: 0,
                totalLoses: 0,
                history: [],
                crashPoint: 0,
                pilotX: 0,
                pilotY: 0,
                animationId: null,
                startTime: 0,
                elapsed: 0,
                betPlaced: false,
                trail: [],
                userId: null,
                houseEdge: 2,
                multiplierMin: 1.0,
                multiplierMax: 100
            };

            const canvas = document.getElementById('rocketCanvas');
            const ctx = canvas.getContext('2d');
            const headerCoin = document.getElementById('headerCoin');
            const multiplierDisplay = document.getElementById('multiplierDisplay');
            const gameStatus = document.getElementById('gameStatus');
            const betAmount = document.getElementById('betAmount');
            const betBtn = document.getElementById('betBtn');
            const cashoutBtn = document.getElementById('cashoutBtn');
            const liveMultiplier = document.getElementById('liveMultiplier');
            const liveProfit = document.getElementById('liveProfit');
            const liveTotalBet = document.getElementById('liveTotalBet');
            const liveWinRate = document.getElementById('liveWinRate');
            const historyList = document.getElementById('historyList');

            // ===== API FUNCTIONS =====
            async function initGame() {
                try {
                    const userRes = await fetch('/api/user', { credentials: 'include' });
                    if (!userRes.ok) {
                        alert('Login dulu!');
                        window.location.href = '/';
                        return;
                    }
                    const user = await userRes.json();
                    state.userId = user.id;
                    state.coins = user.coins;
                    headerCoin.textContent = state.coins.toLocaleString();

                    const settingRes = await fetch('/api/settings/spaceman', { credentials: 'include' });
                    if (settingRes.ok) {
                        const setting = await settingRes.json();
                        state.houseEdge = setting.house_edge || 2;
                        state.multiplierMin = setting.multiplier_min || 1.0;
                        state.multiplierMax = setting.multiplier_max || 100;
                    }
                } catch (e) { console.error(e); }
            }

            async function placeBet(amount) {
                const res = await fetch('/api/bet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ game: 'spaceman', amount })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                state.coins = data.newBalance;
                headerCoin.textContent = state.coins.toLocaleString();
                return data;
            }

            async function recordWin(amount, multiplier) {
                const res = await fetch('/api/win', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ game: 'spaceman', amount, multiplier })
                });
                const data = await res.json();
                if (data.newBalance !== undefined) {
                    state.coins = data.newBalance;
                    headerCoin.textContent = state.coins.toLocaleString();
                }
            }

            async function recordLose(betAmount) {
                await fetch('/api/lose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ game: 'spaceman', betAmount })
                });
            }

            // ===== STARS =====
            function createStars() {
                const container = document.getElementById('stars');
                container.innerHTML = '';
                for (let i = 0; i < 80; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = (Math.random() * 2 + 1) + 'px';
                    star.style.height = star.style.width;
                    star.style.animationDelay = (Math.random() * 3) + 's';
                    star.style.animationDuration = (1 + Math.random() * 2) + 's';
                    container.appendChild(star);
                }
            }
            createStars();

            function setupCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }

            function getMultiplierColor(mult) {
                if (mult >= 50) return { main: '#00ff88', glow: 'rgba(0,255,136,0.4)' };
                if (mult >= 20) return { main: '#00ffff', glow: 'rgba(0,255,255,0.4)' };
                if (mult >= 10) return { main: '#ff00ff', glow: 'rgba(255,0,255,0.4)' };
                if (mult >= 5) return { main: '#ff4466', glow: 'rgba(255,68,102,0.4)' };
                if (mult >= 3) return { main: '#ff8800', glow: 'rgba(255,136,0,0.4)' };
                if (mult >= 2) return { main: '#f5d742', glow: 'rgba(245,215,66,0.3)' };
                return { main: '#f0b90b', glow: 'rgba(240,185,11,0.2)' };
            }

            // ===== DRAW =====
            function drawPilot(x, y) {
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                // Moon
                const moonX = w * 0.15, moonY = h * 0.1, moonRadius = 35;
                const color = getMultiplierColor(state.multiplier);
                const moonGlow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, moonRadius * 3);
                moonGlow.addColorStop(0, color.glow);
                moonGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = moonGlow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius * 3, 0, Math.PI * 2);
                ctx.fill();
                const moonGrad = ctx.createRadialGradient(moonX - 8, moonY - 8, 5, moonX, moonY, moonRadius);
                moonGrad.addColorStop(0, '#f5f0e0');
                moonGrad.addColorStop(0.5, '#e8dcc8');
                moonGrad.addColorStop(0.8, '#c8b898');
                moonGrad.addColorStop(1, '#a89878');
                ctx.fillStyle = moonGrad;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(160,140,120,0.3)';
                ctx.beginPath();
                ctx.arc(moonX - 12, moonY - 8, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(moonX + 14, moonY + 5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(moonX + 5, moonY + 15, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(moonX - 18, moonY + 12, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(moonX - 10, moonY - 12, 10, 0, Math.PI * 2);
                ctx.fill();
                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 20; i++) {
                    const yPos = (i / 20) * h;
                    ctx.beginPath();
                    ctx.moveTo(0, yPos);
                    ctx.lineTo(w, yPos);
                    ctx.stroke();
                }
                const groundY = h - 16;
                ctx.fillStyle = 'rgba(240,185,11,0.03)';
                ctx.fillRect(0, groundY, w, 16);
                ctx.strokeStyle = 'rgba(240,185,11,0.05)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 40; i++) {
                    const xPos = (i / 40) * w;
                    ctx.beginPath();
                    ctx.moveTo(xPos, groundY);
                    ctx.lineTo(xPos, h);
                    ctx.stroke();
                }
                const startX = w * 0.05, startY = groundY - 24;
                ctx.fillStyle = 'rgba(240,185,11,0.08)';
                ctx.beginPath();
                ctx.arc(startX, startY, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(240,185,11,0.1)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(startX, startY + 12);
                ctx.lineTo(startX, groundY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(240,185,11,0.05)';
                ctx.font = '7px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('START', startX, groundY + 10);
                // Trail
                if (state.isFlying && state.trail.length > 0) {
                    state.trail.forEach((p, idx) => {
                        const alpha = (idx / state.trail.length) * 0.5;
                        const size = 2 + (idx / state.trail.length) * 5;
                        const color = getMultiplierColor(state.multiplier);
                        ctx.fillStyle = color.glow.replace('0.4', alpha);
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                // Flame
                if (state.isFlying) {
                    const flameLen = 18 + Math.random() * 22;
                    ctx.fillStyle = 'rgba(255,200,50,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(x - 8, y + 18);
                    ctx.quadraticCurveTo(x - 18, y + 18 + flameLen, x, y + 18 + flameLen + 12);
                    ctx.quadraticCurveTo(x + 18, y + 18 + flameLen, x + 8, y + 18);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,100,0,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(x - 5, y + 18);
                    ctx.quadraticCurveTo(x - 9, y + 18 + flameLen * 0.6, x, y + 18 + flameLen * 0.8);
                    ctx.quadraticCurveTo(x + 9, y + 18 + flameLen * 0.6, x + 5, y + 18);
                    ctx.fill();
                    state.trail.push({ x: x + (Math.random() - 0.5) * 6, y: y + 25 + Math.random() * 10 });
                    if (state.trail.length > 50) state.trail.shift();
                }
                // Spaceman
                const s = 20;
                const grad = ctx.createLinearGradient(x - s, y, x + s, y);
                grad.addColorStop(0, '#4a4a5a');
                grad.addColorStop(0.3, '#8a8a9a');
                grad.addColorStop(0.7, '#8a8a9a');
                grad.addColorStop(1, '#4a4a5a');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(x, y + 6, s * 0.8, s * 0.9, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#6a6a7a';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#3a3a4a';
                ctx.beginPath();
                ctx.roundRect(x - s * 0.5, y - 2, s * 1.0, s * 0.7, 4);
                ctx.fill();
                ctx.strokeStyle = '#5a5a6a';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                ctx.fillStyle = '#2a2a3a';
                ctx.fillRect(x - s * 0.4, y + s * 0.4, 6, 8);
                ctx.fillRect(x + s * 0.2, y + s * 0.4, 6, 8);
                ctx.fillStyle = '#e8e6e3';
                ctx.beginPath();
                ctx.arc(x, y - s * 0.2, s * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#8a8a9a';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#0ecb81';
                ctx.beginPath();
                ctx.ellipse(x, y - s * 0.1, s * 0.4, s * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.ellipse(x - s * 0.1, y - s * 0.2, s * 0.15, s * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f5d0b0';
                ctx.beginPath();
                ctx.arc(x, y - s * 0.05, s * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                ctx.arc(x - s * 0.12, y - s * 0.1, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.12, y - s * 0.1, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#1a1a2a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(x, y + s * 0.02, s * 0.12, 0.1, Math.PI - 0.1);
                ctx.stroke();
                ctx.fillStyle = '#4a4a5a';
                ctx.beginPath();
                ctx.roundRect(x - s * 0.9, y - s * 0.05, s * 0.25, s * 0.5, 4);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + s * 0.65, y - s * 0.05, s * 0.25, s * 0.5, 4);
                ctx.fill();
                const gloveColor = getMultiplierColor(state.multiplier);
                ctx.fillStyle = gloveColor.main;
                ctx.beginPath();
                ctx.arc(x - s * 0.8, y + s * 0.4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.8, y + s * 0.4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a3a4a';
                ctx.beginPath();
                ctx.roundRect(x - s * 0.4, y + s * 0.7, s * 0.25, s * 0.5, 4);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + s * 0.15, y + s * 0.7, s * 0.25, s * 0.5, 4);
                ctx.fill();
                ctx.fillStyle = '#f6465d';
                ctx.beginPath();
                ctx.roundRect(x - s * 0.45, y + s * 1.15, s * 0.35, s * 0.2, 3);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + s * 0.1, y + s * 1.15, s * 0.35, s * 0.2, 3);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.font = '6px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('RMAX', x, y + s * 0.2);
                // Multiplier display
                if (state.isFlying || state.isCrashed) {
                    const mult = state.multiplier;
                    const color = getMultiplierColor(mult);
                    const glowSize = 30 + mult * 2;
                    const glow = ctx.createRadialGradient(w - 60, 16, 0, w - 60, 16, glowSize);
                    glow.addColorStop(0, color.glow);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(w - 60, 16, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = color.main;
                    ctx.font = `bold ${16 + Math.min(mult, 20)}px monospace`;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    ctx.shadowColor = color.main;
                    ctx.shadowBlur = 20 + mult * 2;
                    ctx.fillText(mult.toFixed(2) + 'x', w - 16, 8);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = state.isCrashed ? 'rgba(246,70,93,0.2)' : 'rgba(240,185,11,0.15)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(0, groundY);
                    ctx.lineTo(w, groundY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    if (mult >= 1 && !state.isCrashed) {
                        const speed = Math.floor((mult - 1) * 20);
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.font = '9px monospace';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('⚡ SPEED: ' + speed + '%', 10, groundY - 4);
                    }
                }
            }

            // ===== ROUND RECT =====
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            // ===== GAME LOGIC =====
            async function startGame() {
                if (state.isFlying || state.isCrashed) return;
                const bet = parseInt(betAmount.value) || 100;
                if (bet < 10) {
                    alert('Minimal taruhan 10 koin!');
                    return;
                }
                if (bet > state.coins) {
                    alert('Saldo tidak cukup!');
                    return;
                }

                // Panggil bet
                try {
                    await placeBet(bet);
                } catch (err) {
                    alert(err.message);
                    return;
                }

                state.bet = bet;
                state.betPlaced = true;
                state.isFlying = true;
                state.isCrashed = false;
                state.multiplier = 1.00;
                state.elapsed = 0;
                state.startTime = Date.now();
                state.totalBets++;
                state.trail = [];

                // crash point dengan house edge
                const rand = Math.random();
                const rawCrash = 1 + rand * (state.multiplierMax - 1);
                // Apply house edge: crash lebih rendah sedikit
                state.crashPoint = rawCrash * (1 - state.houseEdge / 100);
                if (state.crashPoint < 1.05) state.crashPoint = 1.05;

                betBtn.disabled = true;
                cashoutBtn.disabled = false;
                gameStatus.className = 'status flying';
                gameStatus.textContent = '🚀 FLYING';

                updateUI();
                updateLiveStats();

                if (state.animationId) cancelAnimationFrame(state.animationId);
                animate();
            }

            function animate() {
                if (!state.isFlying && !state.isCrashed) {
                    state.animationId = null;
                    return;
                }
                if (state.isFlying) {
                    state.elapsed += 0.016;
                    const speed = 0.06 + state.elapsed * 0.003;
                    state.multiplier += speed * 0.02;
                    if (state.multiplier >= state.crashPoint) {
                        crash();
                        return;
                    }
                    const progress = Math.min((state.multiplier - 1) / 10, 1);
                    const w = canvas.width, h = canvas.height, groundY = h - 16;
                    const startX = w * 0.05, startY = groundY - 24;
                    const endX = w * 0.85, endY = h * 0.08;
                    state.pilotX = startX + (endX - startX) * progress;
                    state.pilotY = startY + (endY - startY) * progress;
                    multiplierDisplay.textContent = state.multiplier.toFixed(2);
                    liveMultiplier.textContent = state.multiplier.toFixed(2) + 'x';
                    const profit = Math.round(state.bet * state.multiplier - state.bet);
                    state.currentProfit = profit;
                    liveProfit.textContent = '+' + profit.toLocaleString();
                    liveProfit.className = 'value green';
                    const color = getMultiplierColor(state.multiplier);
                    multiplierDisplay.style.color = color.main;
                    drawPilot(state.pilotX, state.pilotY);
                    state.animationId = requestAnimationFrame(animate);
                }
            }

            async function crash() {
                state.isFlying = false;
                state.isCrashed = true;
                state.multiplier = state.crashPoint;
                multiplierDisplay.textContent = state.multiplier.toFixed(2);
                multiplierDisplay.className = 'multiplier crashed';
                gameStatus.className = 'status crashed';
                gameStatus.textContent = '💥 CRASHED';
                liveMultiplier.textContent = state.multiplier.toFixed(2) + 'x';

                // Panggil API lose
                await recordLose(state.bet);

                let explosionFrames = 0;
                const explosionInterval = setInterval(() => {
                    drawPilot(state.pilotX, state.pilotY);
                    drawExplosion(state.pilotX, state.pilotY, explosionFrames);
                    explosionFrames++;
                    if (explosionFrames > 20) {
                        clearInterval(explosionInterval);
                        drawPilot(state.pilotX, state.pilotY);
                    }
                }, 60);

                state.totalLoses++;
                state.history.push({ bet: state.bet, multiplier: state.multiplier, win: false });
                betBtn.disabled = false;
                cashoutBtn.disabled = true;
                state.betPlaced = false;
                updateUI();
                updateLiveStats();
                updateHistory();

                if (state.coins < 10) {
                    setTimeout(() => {
                        if (confirm('💸 Saldo habis! Reset ke 10000 koin?')) {
                            resetGame();
                        }
                    }, 500);
                }
            }

            function drawExplosion(x, y, frame) {
                const colors = ['#ff6b35', '#ff4444', '#ff8800', '#ffcc00', '#ffffff', '#ff00ff', '#00ffff'];
                const intensity = Math.min(frame / 20, 1);
                const count = Math.floor(20 + intensity * 30);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 10 + Math.random() * 60 * (1 + intensity);
                    const size = 2 + Math.random() * 12 * (1 - intensity * 0.5);
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.3 + Math.random() * 0.5 * (1 - intensity * 0.5);
                    ctx.beginPath();
                    ctx.arc(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist * 0.6, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            async function cashout() {
                if (!state.isFlying || state.isCrashed) return;
                state.isFlying = false;
                const winAmount = Math.round(state.bet * state.multiplier);
                await recordWin(winAmount, state.multiplier);
                state.totalWins++;
                state.history.push({ bet: state.bet, multiplier: state.multiplier, win: true });
                gameStatus.className = 'status cashout';
                gameStatus.textContent = '✅ CASHOUT! ' + state.multiplier.toFixed(2) + 'x';
                liveProfit.textContent = '+' + (winAmount - state.bet).toLocaleString();
                liveProfit.className = 'value green';
                const color = getMultiplierColor(state.multiplier);
                const grad = ctx.createRadialGradient(state.pilotX, state.pilotY, 10, state.pilotX, state.pilotY, 80);
                grad.addColorStop(0, color.glow);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(state.pilotX, state.pilotY, 80, 0, Math.PI * 2);
                ctx.fill();
                betBtn.disabled = false;
                cashoutBtn.disabled = true;
                state.betPlaced = false;
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                    state.animationId = null;
                }
                updateUI();
                updateLiveStats();
                updateHistory();
                drawPilot(state.pilotX, state.pilotY);
            }

            function updateUI() {
                headerCoin.textContent = state.coins.toLocaleString();
            }

            function updateLiveStats() {
                liveTotalBet.textContent = state.totalBets;
                const rate = state.totalBets > 0 ? Math.round((state.totalWins / state.totalBets) * 100) : 0;
                liveWinRate.textContent = rate + '%';
                if (!state.isFlying && !state.isCrashed) {
                    liveMultiplier.textContent = '1.00x';
                    liveProfit.textContent = '-';
                    liveProfit.className = 'value';
                }
            }

            function updateHistory() {
                const recent = state.history.slice(-20);
                if (recent.length === 0) {
                    historyList.innerHTML = '<div style="color:#4a5a6a;font-size:11px;text-align:center;padding:10px;">Belum ada history</div>';
                    return;
                }
                historyList.innerHTML = '';
                recent.slice().reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item ' + (item.win ? 'win' : 'lose');
                    div.innerHTML = `
                        <span class="mult ${item.win ? 'win' : 'lose'}">${item.win ? '✅' : '❌'} ${item.multiplier.toFixed(2)}x</span>
                        <span class="bet">${item.bet.toLocaleString()}</span>
                    `;
                    historyList.appendChild(div);
                });
            }

            function resetGame() {
                state.coins = 10000;
                state.totalBets = 0;
                state.totalWins = 0;
                state.totalLoses = 0;
                state.history = [];
                state.isFlying = false;
                state.isCrashed = false;
                state.betPlaced = false;
                state.multiplier = 1.00;
                state.trail = [];
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                    state.animationId = null;
                }
                betBtn.disabled = false;
                cashoutBtn.disabled = true;
                gameStatus.className = 'status ready';
                gameStatus.textContent = '🚀 READY';
                multiplierDisplay.textContent = '1.00';
                multiplierDisplay.className = 'multiplier';
                liveMultiplier.textContent = '1.00x';
                liveProfit.textContent = '-';
                liveProfit.className = 'value';
                updateUI();
                updateLiveStats();
                updateHistory();
                const w = canvas.width, h = canvas.height, groundY = h - 16;
                state.pilotX = w * 0.05;
                state.pilotY = groundY - 24;
                drawPilot(state.pilotX, state.pilotY);
            }

            function setBet(amount) {
                if (amount > state.coins) {
                    alert('Saldo tidak cukup!');
                    return;
                }
                betAmount.value = amount;
            }

            // ===== EVENT LISTENERS =====
            betBtn.addEventListener('click', startGame);
            cashoutBtn.addEventListener('click', cashout);
            betAmount.addEventListener('change', function() {
                let v = parseInt(this.value) || 10;
                if (v < 10) v = 10;
                if (v > state.coins) v = state.coins;
                this.value = v;
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!betBtn.disabled) startGame();
                } else if (e.key === 'c' || e.key === 'C') {
                    if (!cashoutBtn.disabled) cashout();
                }
            });
            window.addEventListener('resize', () => {
                setupCanvas();
                drawPilot(state.pilotX, state.pilotY);
            });

            // ===== INIT =====
            setupCanvas();
            const w = canvas.width, h = canvas.height, groundY = h - 16;
            state.pilotX = w * 0.05;
            state.pilotY = groundY - 24;
            drawPilot(state.pilotX, state.pilotY);
            updateUI();
            updateLiveStats();
            updateHistory();
            initGame().then(() => {
                updateUI();
                updateLiveStats();
                updateHistory();
            });
            window.setBet = setBet;
            window.resetGame = resetGame;
        })();
    </script>
</body>
